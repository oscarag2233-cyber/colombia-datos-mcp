[project]
name = "colombia-datos-mcp"
version = "0.1.0"
description = "MCP propio de datos abiertos de Colombia (contratación, sanciones, empresas, procesos, jurisprudencia) sin intermediarios de pago"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastmcp>=2.0",
  "httpx>=0.27",
  "rapidfuzz>=3.6",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
colombia-datos-mcp = "datos_co.server:main"
colombia-datos-ingest = "datos_co.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datos_co"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
